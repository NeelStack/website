<svg width="220" height="40" viewBox="0 0 220 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neelstack-dual-grad-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  
  <!-- Logo Mark (Hexagon Monogram in 2 Symmetrical Halves) -->
  <g transform="translate(4, 4) scale(0.32)">
    <path
      d="M15.36,70 L15.36,30 L50,10 L84.64,30"
      fill="none"
      stroke="#3B82F6"
      stroke-width="5.8"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <path
      d="M84.64,30 L84.64,70 L50,90 L15.36,70"
      fill="none"
      stroke="#8B5CF6"
      stroke-width="5.8"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <path
      d="M38,67 V33 L62,67 V33"
      fill="none"
      stroke="url(#neelstack-dual-grad-dark)"
      stroke-width="7"
      stroke-linejoin="round"
      stroke-linecap="butt"
    />
  </g>

  <!-- Symmetrical Wordmark: N (Blue) + ee (Violet Core) + l (Blue) + Stack (White) -->
  <text x="44" y="27" font-family="Geist, Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="-0.035em">
    <tspan fill="#3B82F6">N</tspan><tspan fill="#8B5CF6">ee</tspan><tspan fill="#3B82F6">l</tspan><tspan fill="#FFFFFF" dx="1">Stack</tspan>
  </text>
</svg>
