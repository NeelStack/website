<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ll-unified-grad" x1="4" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="ll-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(4, 4)">
    <path d="M 6 6 H 15.5 L 28.5 24.5 V 6 H 34 V 34 H 24.5 L 11.5 15.5 V 34 H 6 V 6 Z" fill="#0f172a"/>
    <path d="M 9.5 31.5 V 9.5 L 30.5 30.5 V 8.5" stroke="url(#ll-unified-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#ll-glow-filter)"/>
  </g>

  <!-- Brand Typography: Neel in Slate, Stack in Cyan -->
  <text x="52" y="29" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.03em" fill="#0f172a">Neel<tspan fill="#06b6d4">Stack</tspan></text>
  <text x="52" y="41" font-family="Inter, sans-serif" font-size="8" font-weight="700" letter-spacing="0.1em" fill="#475569">ENTERPRISE AI &amp; PRODUCT ENGINEERING</text>
</svg>
