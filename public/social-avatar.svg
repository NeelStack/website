<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Midnight Deep Surface Background -->
  <rect width="512" height="512" rx="108" fill="#020617"/>
  
  <!-- Outer Radial Ambient Aura -->
  <circle cx="256" cy="256" r="220" fill="url(#avatar-aura)" opacity="0.35"/>
  
  <!-- Subtle 4K Engineering Grid Line Texture -->
  <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384 M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>
  
  <!-- Chamfered Container Border Accent -->
  <rect x="12" y="12" width="488" height="488" rx="96" stroke="url(#avatar-border-grad)" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Centered Code-Stack Prism Emblem -->
  <g transform="translate(116, 116) scale(7.1)">
    <!-- Left Architecture Pillar -->
    <rect x="7" y="6" width="7" height="28" rx="2.5" fill="#FFFFFF"/>
    
    <!-- Right Architecture Pillar -->
    <rect x="26" y="6" width="7" height="28" rx="2.5" fill="#FFFFFF"/>
    
    <!-- Code-Stack Precision Prism Diagonal -->
    <path d="M 7 12 L 14 6 L 21 16 L 33 28 L 26 34 L 17 22 Z" fill="url(#avatar-prism-grad)"/>
    
    <!-- Neural Precision Nodes -->
    <circle cx="10.5" cy="9.5" r="2" fill="#020617"/>
    <circle cx="21" cy="16" r="1.5" fill="#38BDF8"/>
    <circle cx="29.5" cy="30.5" r="2" fill="#020617"/>
  </g>
  
  <defs>
    <radialGradient id="avatar-aura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) scale(220)">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="avatar-border-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    
    <linearGradient id="avatar-prism-grad" x1="7" y1="6" x2="33" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
</svg>
