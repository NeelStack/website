<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ogb-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1329"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="ogb-unified-grad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="ogb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogb-bg)"/>
  <rect width="1200" height="630" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="2"/>

  <!-- Grid overlay -->
  <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Glow background -->
  <circle cx="600" cy="240" r="280" fill="rgba(37,99,235,0.12)" filter="url(#ogb-glow)"/>

  <!-- Logo Container Group -->
  <g transform="translate(420, 160)">
    <!-- Pure Geometric N Logo Mark -->
    <g transform="scale(3)">
      <path d="M 6 6 H 15.5 L 28.5 24.5 V 6 H 34 V 34 H 24.5 L 11.5 15.5 V 34 H 6 V 6 Z" fill="#ffffff"/>
      <path d="M 9.5 31.5 V 9.5 L 30.5 30.5 V 8.5" stroke="url(#ogb-unified-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#ogb-glow)"/>
    </g>

    <!-- Typography -->
    <text x="145" y="72" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="64" font-weight="900" letter-spacing="-0.04em" fill="#ffffff">Neel<tspan fill="#38bdf8">Stack</tspan></text>
  </g>

  <!-- Main Headline Tagline -->
  <text x="600" y="380" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.02em" fill="#f8fafc">AI-Native Enterprise Software &amp; Product Engineering</text>
  <text x="600" y="425" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">Scaling Intelligent SaaS Platforms, ERP Systems &amp; Custom AI Agents</text>

  <!-- Footer Tag -->
  <rect x="460" y="480" width="280" height="42" rx="21" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <circle cx="484" cy="501" r="5" fill="#38bdf8"/>
  <text x="500" y="506" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="0.12em" fill="#38bdf8">HTTPS://NEELSTACK.COM</text>
</svg>
