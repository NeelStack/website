<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Slate Gradient Background -->
    <linearGradient id="ogb-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>

    <!-- Brand Dual Gradient -->
    <linearGradient id="ogb-dual-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Multi-aurora glow -->
    <radialGradient id="ogb-glow-blue" cx="15%" cy="15%" r="60%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.35)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0)"/>
    </radialGradient>
    <radialGradient id="ogb-glow-violet" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.35)"/>
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0)"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#ogb-bg)"/>
  <rect width="1200" height="630" fill="url(#ogb-glow-blue)"/>
  <rect width="1200" height="630" fill="url(#ogb-glow-violet)"/>

  <!-- Blueprint Engineering Grid Overlay -->
  <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Frosted Glass Container -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="rgba(11, 18, 32, 0.88)" stroke="rgba(99, 102, 241, 0.40)" stroke-width="1.5"/>

  <!-- Top Left: AI-Native Badge -->
  <g transform="translate(88, 80)">
    <rect width="270" height="38" rx="19" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#8B5CF6"/>
    <text x="36" y="24" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.14em" fill="#C4B5FD">AI-NATIVE PRODUCT ENGINEERING</text>
  </g>

  <!-- Top Right: DPIIT / Startup India Badge -->
  <g transform="translate(820, 80)">
    <rect width="292" height="38" rx="19" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.30)" stroke-width="1"/>
    <text x="20" y="24" font-family="Geist, Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#93C5FD">✦ DPIIT RECOGNIZED · STARTUP INDIA</text>
  </g>

  <!-- Center Brand Logo Lockup -->
  <g transform="translate(385, 175)">
    <!-- 6-Sided Hexagon Monogram -->
    <g transform="scale(1.2)">
      <!-- Top Half: Royal Blue -->
      <path
        d="M15.36,70 L15.36,30 L50,10 L84.64,30"
        fill="none"
        stroke="#3B82F6"
        stroke-width="5.8"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <!-- Bottom Half: Rich Violet -->
      <path
        d="M84.64,30 L84.64,70 L50,90 L15.36,70"
        fill="none"
        stroke="#8B5CF6"
        stroke-width="5.8"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <!-- Inner Geometric N Synapse -->
      <path
        d="M38,67 V33 L62,67 V33"
        fill="none"
        stroke="url(#ogb-dual-grad)"
        stroke-width="7"
        stroke-linejoin="round"
        stroke-linecap="butt"
      />
    </g>

    <!-- Symmetrical Typography -->
    <text x="145" y="78" font-family="Geist, Inter, system-ui, sans-serif" font-size="76" font-weight="900" letter-spacing="-0.04em">
      <tspan fill="#3B82F6">N</tspan><tspan fill="#8B5CF6">ee</tspan><tspan fill="#3B82F6">l</tspan><tspan fill="#FFFFFF" dx="3">Stack</tspan>
    </text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="360" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.025em" fill="#FFFFFF">Engineering Autonomous AI &amp; Enterprise Cloud Systems</text>

  <!-- Sub-Headline -->
  <text x="600" y="405" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#94A3B8">Scaling Intelligent SaaS Platforms · Multi-Agent Workflows · High-Performance Architecture</text>

  <!-- Bottom Badges: The Three Engines -->
  <g transform="translate(88, 490)">
    <!-- Engine 1 -->
    <rect width="180" height="36" rx="10" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.40)" stroke-width="1"/>
    <text x="14" y="23" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#93C5FD">⚡ NeelStack Services</text>

    <!-- Engine 2 -->
    <g transform="translate(195, 0)">
      <rect width="135" height="36" rx="10" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.40)" stroke-width="1"/>
      <text x="14" y="23" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#C4B5FD">🎓 DhruvaOS</text>
    </g>

    <!-- Engine 3 -->
    <g transform="translate(345, 0)">
      <rect width="135" height="36" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.40)" stroke-width="1"/>
      <text x="14" y="23" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#67E8F9">🛠️ ToolVines</text>
    </g>
  </g>

  <!-- Bottom Right: HTTPS URL -->
  <g transform="translate(930, 495)">
    <text font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="800" letter-spacing="0.1em">
      <tspan fill="#8B5CF6">https://</tspan><tspan fill="#E2E8F0">neelstack.com</tspan>
    </text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect y="624" width="1200" height="6" fill="url(#ogb-dual-grad)"/>
</svg>
