<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lmd-unified-grad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="lmd-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Solid Geometric N Silhouette -->
  <path d="M 6 6 H 15.5 L 28.5 24.5 V 6 H 34 V 34 H 24.5 L 11.5 15.5 V 34 H 6 V 6 Z" fill="#ffffff"/>

  <!-- Unbroken Continuous Embedded Signal Line -->
  <path d="M 9.5 31.5 V 9.5 L 30.5 30.5 V 8.5" stroke="url(#lmd-unified-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#lmd-glow-filter)"/>
</svg>
