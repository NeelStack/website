<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sal-bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fafbff"/>
      <stop offset="100%" stop-color="#f1f4fb"/>
    </linearGradient>
    <linearGradient id="sal-signal-grad" x1="40" y1="40" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="sal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" rx="90" fill="url(#sal-bg)"/>
  <rect width="400" height="400" rx="90" fill="none" stroke="rgba(37,99,235,0.2)" stroke-width="4"/>

  <g transform="translate(40, 40) scale(8)">
    <path d="M 6 6 H 15.5 L 28.5 24.5 V 6 H 34 V 34 H 24.5 L 11.5 15.5 V 34 H 6 V 6 Z" fill="#0f172a"/>
    <path d="M 9.5 31.5 V 9.5 L 30.5 30.5 V 8.5" stroke="url(#sal-signal-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sal-glow)"/>
  </g>
</svg>
