    stroke-width="5.8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <!-- Bottom Half (3 edges: Rich Violet) -->
  <path
    d="M84.64,30 L84.64,70 L50,90 L15.36,70"
    fill="none"
    stroke="#8B5CF6"
    stroke-width="5.8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Geometric N Synapse -->
  <path
    d="M38,67 V33 L62,67 V33"
